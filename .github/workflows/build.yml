name: Build and Publish Android Release Package

on:
  push:
    tags:
      - 'v*'
      - '*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish Package
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/flutter-android-builder:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Build Release App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Extract Tag & Version
        id: vars
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION=${TAG_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create Zip Package for GitHub Packages
        run: |
          mkdir -p package_dist
          cp build/app/outputs/flutter-apk/*.apk package_dist/
          cp build/app/outputs/bundle/release/app-release.aab package_dist/
          cd package_dist
          zip -r ../charted-android-package-${{ steps.vars.outputs.TAG_NAME }}.zip .
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: charted-android-package-${{ steps.vars.outputs.TAG_NAME }}
          path: package_dist/

      - name: Publish GitHub Release Package
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            package_dist/*.apk
            package_dist/*.aab
            charted-android-package-${{ steps.vars.outputs.TAG_NAME }}.zip
          generate_release_notes: true
          name: "Release ${{ steps.vars.outputs.TAG_NAME }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
