name: charted
description: A local document scanner with OCR and PDF export.
publish_to: "none"
version: 1.1.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^13.1.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  pdf: ^3.11.1
  google_mlkit_text_recognition: ^0.15.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/charted_icon.svg
